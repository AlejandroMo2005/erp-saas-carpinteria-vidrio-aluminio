<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Sistema de Gestión de Inventario y Facturación — Vidrios y Aluminios Alejandro"
    />
    <title>Gestión V&amp;A Alejandro</title>

    <!--
      🛡 Sprint 18 — Google Fonts ELIMINADO del HTML
      
      ANTES: 2 preconnects + link stylesheet a fonts.googleapis.com
        → Chrome iniciaba la descarga de 57 kB de woff2 (DM Sans)
        → Con font-display:optional, browser esperaba ~100ms el woff2
        → Resultado: Element render delay 360ms → LCP 3.7s en Slow 4G
      
      AHORA: cero requests a Google Fonts
        → global.css ya tiene @font-face { font-family:'DM Sans'; src: local(...) }
        → Mapea 'DM Sans' a la fuente de sistema (San Francisco, Segoe UI, Roboto)
        → size-adjust + ascent-override + descent-override calibran las métricas
        → Render instantáneo, cero bytes de red para fuentes
        → LCP esperado: ≤ 1.0s en Slow 4G (solo TTFB ~330ms + paint ~50ms)
    -->

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <script>
      try {
        if (localStorage.getItem('user')) {
          document.documentElement.classList.add('auth');
        }
      } catch(e) {}
    </script>

    <style>
      *,::before,::after{box-sizing:border-box;margin:0;padding:0}
      html{
        height:100%;
        background:#0f172a;
        scrollbar-gutter:stable;
      }
      body{height:100%;background:#0f172a}
      /*
        🛡 Sprint 18: font-family del shell usa sistema directamente.
        Antes: sans-serif (genérico, cualquier cosa)
        Ahora: stack explícito idéntico al de body en global.css
        → Chrome no espera ninguna fuente web para pintar el h1 del LCP
      */
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
      #root{min-height:100vh}

      html.auth #app-shell{
        display:none !important;
      }

      #app-shell{
        position:fixed;
        inset:0;
        z-index:9999;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:1rem;
        background:#0f172a;
        text-align:center;
        padding:0 1rem;
      }

      #app-shell-logo{
        font-size:1.5rem;
        font-weight:900;
        color:#f8fafc;
        letter-spacing:-0.02em;
        line-height:1.2;
      }
      #app-shell-logo span{color:#4338ca}

      #app-shell-spinner{
        width:2.5rem;
        height:2.5rem;
        border:3px solid rgba(248,250,252,0.15);
        border-top-color:#4338ca;
        border-radius:50%;
        animation:shell-spin 0.8s linear infinite;
      }

      #app-shell-sub{
        font-size:0.875rem;
        color:rgba(248,250,252,0.5);
        font-weight:500;
      }

      @keyframes shell-spin{to{transform:rotate(360deg)}}

      #dashboard-shell{
        margin-top:2rem;
        width:100%;
        max-width:900px;
        display:flex;
        flex-direction:column;
        gap:1.2rem;
      }
      .dashboard-title{
        font-size:1.6rem;
        font-weight:700;
        color:#f8fafc;
      }
      .title-highlight{color:#4338ca}
      .dashboard-sub{
        font-size:0.9rem;
        color:rgba(248,250,252,0.6);
      }
      .dashboard-kpis{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
        gap:1rem;
        margin-top:0.5rem;
      }

      .kpi-skeleton{
        height:70px;
        border-radius:10px;
        background:rgba(255,255,255,0.06);
        position:relative;
        overflow:hidden;
      }
      .kpi-skeleton::after{
        content:'';
        position:absolute;
        inset:0;
        transform:translateX(-100%);
        background:linear-gradient(
          90deg,
          transparent 0%,
          rgba(255,255,255,0.15) 50%,
          transparent 100%
        );
        animation:kpi-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes kpi-shimmer{
        100%{transform:translateX(200%);}
      }

      /* ── Ocultar shell cuando React monta ────────────────────────────── */
      .app-shell--hidden{
        display:none;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta aplicación.</noscript>

    <div id="root">

      <div id="app-shell">

        <div id="app-shell-logo">
          Vidrios y Aluminios<br/>
          <span>"Alejandro"</span>
        </div>

        <div id="app-shell-spinner"></div>

        <p id="app-shell-sub">Cargando sistema…</p>
        <div id="dashboard-shell">
          <h1 class="dashboard-title">
            Vidrios y Aluminios <span class="title-highlight">"Alejandro"</span>
          </h1>
          <p class="dashboard-sub">Cargando sistema…</p>
          <div class="dashboard-kpis">
            <div class="kpi-skeleton"></div>
            <div class="kpi-skeleton"></div>
            <div class="kpi-skeleton"></div>
            <div class="kpi-skeleton"></div>
          </div>
        </div>

      </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>

name: Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Generate and validate documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage

      - name: Inspect documentation runtime
        run: |
          node -p "JSON.stringify({
            node: process.version,
            platform: process.platform,
            arch: process.arch,
            v8: process.versions.v8
          }, null, 2)"

      - name: Verify downloaded coverage artifact
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = 'coverage/coverage-final.json';

          if (!fs.existsSync(path)) {
            console.error(`No existe el archivo esperado: ${path}`);
            process.exit(1);
          }

          const coverage = JSON.parse(fs.readFileSync(path, 'utf8'));

          console.log(JSON.stringify({
            file: path,
            files: Object.keys(coverage).length,
            bytes: fs.statSync(path).size,
          }, null, 2));
          NODE

      - name: Generate lint evidence
        run: |
          mkdir -p reports
          npx eslint . -f json -o reports/lint.json

      - name: Generate documentation
        run: npm run docs:generate

      
      - name: Inspect generated documentation differences
        if: always()
        run: |
          git diff -- docs/generated/architecture/project-structure.md
          git diff -- docs/generated/quality/lint-evidence.md
          git diff -- docs/generated/quality/test-evidence.md
          git diff -- docs/generated/quality/tests.md

      - name: Validate documentation
        run: npm run docs:validate

      - name: Verify generated documentation
        run: npm run docs:verify

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: generated-documentation
          path: docs/generated/
          if-no-files-found: error
          retention-days: 14

name: CI Backend

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend - Unit Tests & Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: inventario_proformas_test
      DB_PORT: 3306
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRE: 15m
      JWT_EXPIRE_MINUTES: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 14

  backend-integration:
    name: Backend - Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: e2e-root
      DB_NAME: inventario_proformas_e2e
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRE: 15m
      JWT_EXPIRE_MINUTES: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start E2E infrastructure
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml up -d --wait

      - name: Install backend dependencies
        run: npm ci

      - name: Run integration tests
        working-directory: .
        run: |
          echo "=== ENV INTEGRATION ==="
          echo "DB_HOST=$DB_HOST"
          echo "DB_PORT=$DB_PORT"
          echo "DB_NAME=$DB_NAME"
          echo "REDIS_HOST=$REDIS_HOST"
          echo "REDIS_PORT=$REDIS_PORT"
          echo "=== DOCKER PORTS ==="
          docker compose -f docker-compose.e2e.yml ps
          echo "=== TESTS ==="
          cd backend
          npm run test:integration

      - name: Stop E2E infrastructure
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml down -v

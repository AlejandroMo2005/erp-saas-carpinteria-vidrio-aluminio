name: CI Frontend y Backend

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend - Lint, Tests, Coverage & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Inspect frontend test environment
        run: |
          node -p "'Node: ' + process.version"
          npm ls vitest @vitest/coverage-v8 vite @vitejs/plugin-react
          node -e "console.log('Coverage provider:', require('@vitest/coverage-v8/package.json').version)"

      - name: Inspect coverage transformation dependencies
        run: |
          npm ls @babel/core @babel/parser @jridgewell/trace-mapping instanbul-lib-coverage magic-string esbuild
      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build production application
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  backend-tests:
    name: Backend - Lint, Unit Tests & Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: inventario_proformas_test
      DB_PORT: 3306
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRE: 15m
      JWT_EXPIRE_MINUTES: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 14

  backend-integration:
    name: Backend - Integration Tests (MySQL + Redis)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: e2e-root
      DB_NAME: inventario_proformas_e2e
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRE: 15m
      JWT_EXPIRE_MINUTES: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start E2E infrastructure
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml up -d --wait

      - name: Install backend dependencies
        run: npm ci

      - name: Run integration tests
        working-directory: .
        run: |
          docker compose -f docker-compose.e2e.yml ps
          cd backend
          npm run test:integration

      - name: Stop E2E infrastructure
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml down -v

  performance-test:
    name: Backend - Prueba de rendimiento HTTP
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: e2e-root
      DB_NAME: inventario_proformas_e2e
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRE: 15m
      JWT_EXPIRE_MINUTES: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start E2E infrastructure
        run: docker compose -f docker-compose.e2e.yml up -d --wait

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend
        run: |
          cd backend
          nohup node server.js > /tmp/backend-performance.log 2>&1 &
          echo $! > /tmp/backend-performance.pid

      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/api > /tmp/api-response.json; then
              node --input-type=commonjs -e "const r=require('/tmp/api-response.json'); if (r.success !== true) process.exit(1)" || exit 1
              echo "La API responde correctamente."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/backend-performance.log
          exit 1

      - name: Run HTTP load test
        run: |
          mkdir -p reports
          npx autocannon --json -c 10 -d 20 http://127.0.0.1:5000/api > reports/performance-results.json
          node --input-type=commonjs -e "const r=require('./reports/performance-results.json'); console.log(JSON.stringify({requests:r.requests,latency:r.latency,throughput:r.throughput,errors:r.errors,timeouts:r.timeouts,non2xx:r.non2xx},null,2)); if (!r.requests || Number(r.requests.sent || 0) <= 0 || !r.latency || Number(r.latency.totalCount || 0) <= 0 || !r.throughput || Number(r.errors || 0) + Number(r.timeouts || 0) + Number(r.non2xx || 0) > 0) process.exit(1)"

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: reports/performance-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend-performance.pid ]; then
            kill "$(cat /tmp/backend-performance.pid)" 2>/dev/null || true
          fi

      - name: Stop E2E infrastructure
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  docker-validation:
    name: Docker - Compose y servicios E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.e2e.yml config --quiet

      - name: Start services and wait for readiness
        run: docker compose -f docker-compose.e2e.yml up -d --wait

      - name: Verify service status
        run: |
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml exec -T mysql-e2e \
            mysqladmin ping -h localhost -uroot -pe2e-root
          docker compose -f docker-compose.e2e.yml exec -T redis-e2e \
            redis-cli ping

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  sonarcloud:
    name: SonarCloud - Analysis
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
      - backend-tests

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  documentation:
    name: Documentation - Final Validation
    needs:
      - frontend-tests
      - backend-tests
      - backend-integration
      - performance-test
      - docker-validation
      - sonarcloud
    uses: ./.github/workflows/documentation.yml